name: Auto Deploy to Droplet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/video-downloader
            git pull origin main
            npm install
            # YouTube PO token serveri (bepul, bot tekshiruvini chetlab o'tish uchun)
            if command -v docker >/dev/null 2>&1; then
              docker start bgutil-provider >/dev/null 2>&1 || \
                docker run --name bgutil-provider -d --init --restart unless-stopped \
                  -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider || true
            fi
            pm2 restart downloader-bot

      - name: Update Cobalt Cookies
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Cobalt cookies.json faylini yangilash (agar INSTAGRAM_COOKIES secret mavjud bo'lsa)
            if [ -n "${{ secrets.INSTAGRAM_COOKIES }}" ]; then
              echo '${{ secrets.INSTAGRAM_COOKIES }}' > /root/cobalt/cookies.json
              echo "✅ Cobalt cookies.json yangilandi"
              # Cobalt konteynerini qayta ishga tushirish
              cd /root/cobalt && docker compose restart || true
            fi